
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <!-- CINEMATIC NEXUS-9 BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03060d"/>
      <stop offset="45%" stop-color="#080d1b"/>
      <stop offset="75%" stop-color="#0b1021"/>
      <stop offset="100%" stop-color="#06151b"/>
    </linearGradient>

    <linearGradient id="accent">
      <stop offset="0%" stop-color="#43e8d8"/>
      <stop offset="55%" stop-color="#6d8dff"/>
      <stop offset="100%" stop-color="#bb72ff"/>
    </linearGradient>

    <linearGradient id="circuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43e8d8"/>
      <stop offset="100%" stop-color="#a16bff"/>
    </linearGradient>

    <radialGradient id="tealGlow">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity=".19"/>
      <stop offset="55%" stop-color="#00a6a6" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#00a6a6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".19"/>
      <stop offset="55%" stop-color="#6d28d9" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none"
            stroke="#8ab4d8" stroke-opacity=".065" stroke-width=".7"/>
    </pattern>

    <pattern id="microGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none"
            stroke="#43e8d8" stroke-opacity=".025" stroke-width=".5"/>
    </pattern>
  </defs>

  <!-- BACKGROUND BASE -->
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="20" fill="url(#microGrid)"/>

  <!-- ATMOSPHERIC LIGHT -->
  <ellipse cx="960" cy="150" rx="390" ry="300" fill="url(#tealGlow)"/>
  <ellipse cx="1070" cy="270" rx="300" ry="210" fill="url(#violetGlow)"/>
  <ellipse cx="780" cy="20" rx="240" ry="150" fill="url(#violetGlow)"/>

  <!-- SUBTLE HORIZONTAL LIGHT BEAMS -->
  <path d="M600 70H1200" stroke="#43e8d8"
        stroke-opacity=".07" stroke-width="1"/>
  <path d="M680 275H1200" stroke="#a16bff"
        stroke-opacity=".09" stroke-width="1"/>
  <path d="M750 0V340" stroke="#43e8d8"
        stroke-opacity=".05" stroke-width="1"/>

  <!-- FUTURISTIC CIRCUIT NETWORK -->
  <g fill="none" stroke="url(#circuit)" stroke-width="1.25"
     stroke-linecap="round" stroke-linejoin="round" opacity=".68">
    <path d="M710 0V44H765V76H842V108H920"/>
    <path d="M790 0V25H850V55H930V83H1015V118H1200"/>
    <path d="M900 0V35H965V61H1040V91H1110"/>
    <path d="M1200 145H1110V127H1035V155H980V182H920"/>
    <path d="M1200 205H1135V225H1060V247H985V277H920V340"/>
    <path d="M1200 300H1150V278H1095V257"/>
    <path d="M760 340V300H815V275H865V244H915"/>
    <path d="M680 255H735V230H790V205H845"/>
    <path d="M735 120H785V143H825V169H875"/>
    <path d="M1010 340V315H1045V291H1110V265"/>
    <path d="M1080 0V24H1120V52H1175V75H1200"/>
  </g>

  <!-- SECONDARY FINE CIRCUITS -->
  <g fill="none" stroke="#43e8d8" stroke-width=".7"
     stroke-opacity=".3">
    <path d="M820 0V15H880V32H950"/>
    <path d="M970 340V322H1010V304H1060"/>
    <path d="M1200 95H1165V110H1130V130"/>
    <path d="M690 175H730V190H770"/>
    <path d="M880 340V315H900V294H930"/>
  </g>

  <!-- CIRCUIT NODES -->
  <g fill="#43e8d8">
    <circle cx="765" cy="44" r="2.5"/>
    <circle cx="842" cy="108" r="2.5"/>
    <circle cx="1015" cy="118" r="2.5"/>
    <circle cx="980" cy="182" r="2.5"/>
    <circle cx="1060" cy="247" r="2.5"/>
    <circle cx="815" cy="300" r="2.5"/>
    <circle cx="825" cy="169" r="2"/>
  </g>

  <g fill="#bb72ff">
    <circle cx="930" cy="83" r="2"/>
    <circle cx="1060" cy="291" r="2"/>
    <circle cx="1135" cy="225" r="2"/>
    <circle cx="770" cy="205" r="2"/>
  </g>

  <!-- HOLOGRAPHIC ORBITAL GEOMETRY -->
  <g transform="translate(960 169)" fill="none">
    <circle r="128" stroke="#43e8d8"
            stroke-opacity=".12" stroke-width="1"/>
    <circle r="108" stroke="#7d8bff"
            stroke-opacity=".25" stroke-width="1.2"/>
    <circle r="88" stroke="#43e8d8"
            stroke-opacity=".42" stroke-width="1"
            stroke-dasharray="2 9"/>
    <circle r="68" stroke="#bb72ff"
            stroke-opacity=".42" stroke-width="1"
            stroke-dasharray="38 12 5 12"/>
    <ellipse rx="108" ry="40" stroke="#43e8d8"
             stroke-opacity=".2" transform="rotate(-35)"/>
    <ellipse rx="108" ry="40" stroke="#bb72ff"
             stroke-opacity=".2" transform="rotate(55)"/>
    <path d="M-47-27L0-54L47-27V27L0 54L-47 27Z"
          stroke="url(#accent)" stroke-width="1.8"
          stroke-opacity=".85"/>
    <path d="M-25-14L0-29L25-14V14L0 29L-25 14Z"
          stroke="#43e8d8" stroke-width="1.5"
          fill="#43e8d8" fill-opacity=".08"/>
    <path d="M-12-7L0-14L12-7V7L0 14L-12 7Z"
          fill="#43e8d8" fill-opacity=".18"
          stroke="#43e8d8" stroke-width="1.3"/>
    <circle r="3" fill="#d4fff9" stroke="none"/>
  </g>

  <!-- CORNER DETAILS -->
  <path d="M1140 25H1165V50" fill="none"
        stroke="#43e8d8" stroke-opacity=".5" stroke-width="1.5"/>
  <path d="M35 290V315H60" fill="none"
        stroke="#43e8d8" stroke-opacity=".25" stroke-width="1.5"/>

  <!-- ORIGINAL BANNER CONTENT: UNCHANGED -->
  <path d="M58 54H106" stroke="#43e8d8"
        stroke-width="3" stroke-linecap="round"/>

  <text x="58" y="100" fill="#91a4c4"
        font-family="monospace" font-size="15" letter-spacing="4">
    SOFTWARE / SYSTEMS / CURIOSITY
  </text>

  <text x="54" y="174" fill="#f3f7ff"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="68" letter-spacing="-2">
    NEOBYTE
  </text>

  <text x="59" y="214" fill="#b7c6df"
        font-family="monospace" font-size="19">
    Building ideas into working software.
  </text>

  <rect x="58" y="250" width="220" height="34" rx="17"
        fill="#102b37" stroke="#43e8d8" stroke-opacity=".7"/>

  <circle cx="77" cy="267" r="4" fill="#67f5bd"/>

  <text x="91" y="272" fill="#c6fff1"
        font-family="monospace" font-size="12" letter-spacing="1">
    IT STUDENT / DEVELOPER
  </text>

  <text x="1140" y="314" text-anchor="end" fill="#91a4c4"
        font-family="monospace" font-size="11" letter-spacing="2">
    N9 // 001
  </text>
</svg>
